[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "libreoffice-ai-agent"
version = "0.1.9"
description = "LibreOffice AI Agent extension and local sidecar scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "typing-extensions>=4.12,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<0.7",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["extension/tests", "sidecar/tests"]
pythonpath = ["extension/src", "sidecar/src", "shared/src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["extension/src", "sidecar/src", "shared/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
